<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gamepad test — does the VRC dongle show up?</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        background: #0f1115; color: #e6e9ef; margin: 0; padding: 2rem;
        max-width: 760px; margin-inline: auto;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
      p.sub { color: #8b93a7; margin: 0 0 1.25rem; }
      .pad { background: #161922; border: 1px solid #232838; border-radius: 10px; padding: 1rem 1.1rem; margin: 1rem 0; }
      .pad.vrc { border-color: #34d399; }
      .pad h2 { font-size: 0.95rem; margin: 0 0 0.5rem; word-break: break-all; }
      .pad .meta { color: #8b93a7; font-size: 0.8rem; margin-bottom: 0.75rem; }
      .row { display: flex; align-items: center; gap: 0.6rem; margin: 0.3rem 0; font-variant-numeric: tabular-nums; font-size: 0.8rem; }
      .row .name { width: 64px; color: #aab2c5; }
      .row .val { width: 56px; text-align: right; color: #e6e9ef; }
      .track { position: relative; flex: 1; height: 14px; background: #1b1f29; border-radius: 7px; overflow: hidden; }
      .fill { position: absolute; top: 0; bottom: 0; left: 50%; background: #3b82f6; }
      .center-mark { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: #4b5366; }
      .btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 0.6rem; }
      .b { min-width: 22px; height: 22px; padding: 0 4px; border-radius: 5px; background: #1b1f29; color: #8b93a7; font-size: 0.65rem; display: grid; place-items: center; }
      .b.on { background: #34d399; color: #06281d; }
      #empty { color: #f59e0b; }
      code { background: #1b1f29; padding: 0.1rem 0.35rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Gamepad API 테스트</h1>
    <p class="sub">
      이 페이지를 <b>Chrome/Edge</b>에서 열고, 동글에 연결된 <b>조종기 스틱을 한 번 움직이거나 버튼을 누르세요</b>
      (게임패드는 첫 입력이 있어야 목록에 나타납니다). <code>Virtual RC USB</code> 가 보이면 초록 테두리로 표시됩니다.
    </p>
    <div id="list"></div>
    <p id="empty">아직 게임패드 없음 — 조종기를 움직여 보세요.</p>

    <script>
      const listEl = document.getElementById('list');
      const emptyEl = document.getElementById('empty');

      function isVRC(id) {
        // Chrome gamepad id usually contains vendor/product like "07c0-1125" or "Virtual RC".
        return /virtual rc/i.test(id) || /07c0/i.test(id) || /(^|[^0-9a-f])1984-/i.test(id);
      }

      function render() {
        const pads = [...navigator.getGamepads()].filter(Boolean);
        emptyEl.style.display = pads.length ? 'none' : 'block';
        listEl.innerHTML = '';
        for (const gp of pads) {
          const card = document.createElement('div');
          card.className = 'pad' + (isVRC(gp.id) ? ' vrc' : '');
          const axes = gp.axes
            .map((a, i) => {
              const pct = ((a + 1) / 2) * 100;
              const left = Math.min(50, pct);
              const width = Math.abs(pct - 50);
              return `<div class="row"><span class="name">axis ${i}</span>
                <div class="track"><div class="center-mark"></div>
                <div class="fill" style="left:${left}%;width:${width}%"></div></div>
                <span class="val">${a.toFixed(3)}</span></div>`;
            })
            .join('');
          const btns = gp.buttons
            .map((b, i) => `<div class="b ${b.pressed ? 'on' : ''}">${i}${b.value && b.value !== 1 ? ':' + b.value.toFixed(2) : ''}</div>`)
            .join('');
          card.innerHTML = `<h2>${gp.id}</h2>
            <div class="meta">index ${gp.index} · mapping "${gp.mapping || '(none)'}" · ${gp.axes.length} axes · ${gp.buttons.length} buttons</div>
            ${axes}<div class="btns">${btns}</div>`;
          listEl.appendChild(card);
        }
        requestAnimationFrame(render);
      }

      window.addEventListener('gamepadconnected', (e) => console.log('gamepadconnected:', e.gamepad.id));
      requestAnimationFrame(render);
    </script>
  </body>
</html>
